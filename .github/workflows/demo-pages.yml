# Optionele statische GitHub Pages-demo. De echte RANK11-testpilot draait op Cloudflare.
# GitHub Pages moet door een repo-admin worden ingeschakeld; de GitHub App kan
# de Pages-site niet aanmaken (403 Resource not accessible by integration).
# Daarom geen automatische push-deploy die onterecht rood blijft.
name: RANK11 GitHub Pages-demo (optioneel)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - name: Bouw uitsluitend de fictieve demo
        run: npm run build
        env:
          VITE_PUBLIC_DEMO: 'true'
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
