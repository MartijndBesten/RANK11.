name: RANK11 code controleren

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rank11-code-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Dependencies
        run: npm ci
      - name: Engine-, API- en privacytests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Webbuild
        run: npm run build
      - name: Wrangler dry-run (geen deployment)
        run: npm run deploy:dry -w apps/api
      - name: Pilotcheck-regressietests
        run: node --test scripts/check-pilot-access.test.mjs scripts/cloudflare-pilot-preflight.test.mjs
