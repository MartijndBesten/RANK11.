name: RANK11 besloten testpilot uitrollen

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Typ SYNTHETIC-ONLY voor de geïsoleerde RANK11-testomgeving'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: rank11-isolated-pilot-deploy
  cancel-in-progress: false

jobs:
  protected-synthetic-deploy:
    runs-on: ubuntu-latest
    environment: rank11-test
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Controleer main en expliciete pilotbevestiging
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'SYNTHETIC-ONLY'
      - name: Installeer en test zonder geheime variabelen
        run: |
          npm ci
          npm test
          npm audit --omit=dev --audit-level=high
          npm run typecheck
          node --test scripts/*.test.mjs
          VITE_PUBLIC_DEMO=0 VITE_ONLINE_ONLY=1 npm run build
          node scripts/assert-online-build.mjs
          npm run deploy:dry -w apps/api
      - name: Verifieer EU-D1 en volledig private R2
        run: node scripts/cloudflare-pilot-preflight.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Controleer of benodigde geheimen aanwezig zijn
        env:
          RANK11_PILOT_ACCESS_USER: ${{ secrets.RANK11_PILOT_ACCESS_USER }}
          RANK11_PILOT_ACCESS_PASSWORD: ${{ secrets.RANK11_PILOT_ACCESS_PASSWORD }}
          RANK11_INTEGRATION_KEY: ${{ secrets.RANK11_INTEGRATION_KEY }}
        run: |
          test -n "$RANK11_PILOT_ACCESS_USER"
          test "${#RANK11_PILOT_ACCESS_PASSWORD}" -ge 32
          test "${#RANK11_INTEGRATION_KEY}" -ge 32
      - name: Publiceer eerst fail-closed beveiligde Worker
        working-directory: apps/api
        run: npx wrangler deploy --env test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Plaats drie Worker-secrets vanuit GitHub Secrets
        working-directory: apps/api
        run: |
          printf '%s' "$RANK11_PILOT_ACCESS_USER" | npx wrangler secret put PILOT_ACCESS_USER --env test
          printf '%s' "$RANK11_PILOT_ACCESS_PASSWORD" | npx wrangler secret put PILOT_ACCESS_PASSWORD --env test
          printf '%s' "$RANK11_INTEGRATION_KEY" | npx wrangler secret put INTEGRATION_KEY --env test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RANK11_PILOT_ACCESS_USER: ${{ secrets.RANK11_PILOT_ACCESS_USER }}
          RANK11_PILOT_ACCESS_PASSWORD: ${{ secrets.RANK11_PILOT_ACCESS_PASSWORD }}
          RANK11_INTEGRATION_KEY: ${{ secrets.RANK11_INTEGRATION_KEY }}
      - name: Migreer uitsluitend de geverifieerde testdatabase
        working-directory: apps/api
        run: npx wrangler d1 migrations apply DB --remote --env test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Upload testfrontend private R2; index.html als laatste
        run: node scripts/upload-pilot-assets.mjs
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Activeer nieuwe beveiligde Worker-versie
        working-directory: apps/api
        run: npx wrangler deploy --env test
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Remote toegangscheck is verplicht
        run: node scripts/check-pilot-access.mjs
        env:
          PILOT_REQUIRE_AUTH: '1'
          PILOT_URL: https://rank11-test.martijndenbesten.com
          PILOT_ACCESS_USER: ${{ secrets.RANK11_PILOT_ACCESS_USER }}
          PILOT_ACCESS_PASSWORD: ${{ secrets.RANK11_PILOT_ACCESS_PASSWORD }}
      - name: Maak buildidentiteit zichtbaar zonder geheimen
        run: |
          echo 'Isolated RANK11 pilot code: '$GITHUB_SHA
          echo 'Origin: https://rank11-test.martijndenbesten.com'
          echo 'Alleen synthetische testdata; accountrooktest en iPhone-test blijven aparte gates.'
